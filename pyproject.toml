[project]
name = "niceclaude"
# The only place the version is stored. `niceclaude version` reads it back from
# the installed distribution's metadata rather than from a literal in the source,
# so there is nothing here to drift out of agreement with.
#
# When you change this line, add a CHANGELOG.md entry in the same commit. The
# release is a tag push and publish.yml refuses a tag that disagrees with this
# number, so this line and the tag are checked against each other -- but nothing
# checks that the release was ever described. That part is on you.
version = "0.2.0"
description = "Pace Claude Code background work against its own usage windows, so it yields budget to your foreground work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Windows ships no tz database, so zoneinfo cannot resolve the IANA zone names
# `/usage` prints and the reset time would have to be inferred as machine-local.
# That inference can fail OPEN -- the one direction this tool must not fail in --
# so it is bought out with one small pure-data package. Linux and macOS use the
# system database and stay dependency-free. The hook never touches timezones at
# all; it reads a precomputed epoch, so the hot path is unaffected either way.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
niceclaude = "niceclaude.cli:main"
# Separate entry point for the hot path. It resolves to a native launcher that
# execs the interpreter directly -- no `uv run` environment resolution -- and
# targets a module that imports only json/os/sys/time. Routing the hook through
# cli:main instead would drag in argparse/re/subprocess and cost ~13ms on every
# tool call in every agent and subagent.
niceclaude-hook = "niceclaude.hook:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niceclaude"]
